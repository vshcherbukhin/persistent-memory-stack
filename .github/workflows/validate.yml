name: Validate release

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - run: npm run verify:dependencies
      - run: npm run audit:dependencies

  validation:
    name: Tests and production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Clean locked installations
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/dashboard --no-audit --no-fund
          npm ci --prefix apps/onboard --no-audit --no-fund
          npm ci --prefix apps/documentation --no-audit --no-fund
          python -m pip install --require-hashes -r documentation/build-requirements.lock
          python -m pip install --require-hashes -r documentation/requirements.lock
      - run: npm run build
      - run: npm run build:web --prefix apps/onboard
      - run: npm run typecheck
      - run: npm run typecheck --prefix apps/onboard
      - run: npm test
      - run: npm test --prefix apps/onboard
      - run: npm run docs:build
      - run: npm run validate:release-upgrade
      - run: node scripts/release-notes.mjs --check

  node22:
    name: Supported Node 22 host and storage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run test:host
      - run: npm run test:shared
      - run: npm run typecheck:shared

  release-checks:
    name: Release checks
    if: always()
    needs: [security, validation, node22]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          SECURITY: ${{ needs.security.result }}
          VALIDATION: ${{ needs.validation.result }}
          NODE22: ${{ needs.node22.result }}
        run: test "$SECURITY" = success && test "$VALIDATION" = success && test "$NODE22" = success
