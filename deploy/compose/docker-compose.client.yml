##############################################################################
# persistent-memory — CLIENT bundle (Phase 1 scaffold)
#
# Legacy client bundle: containerized stdio MCP only. NO storage services here.
# New installs should use either:
#   - PM_MCP_RUNTIME=stream: deploy/compose/docker-compose.yml profile "mcp-stream"
#   - PM_MCP_RUNTIME=node: local Node launcher apps/mcp/persistent-memory-mcp.sh
#
# This file is retained for old Docker-stdio smoke workflows only. It intentionally
# uses a distinct Compose project so inherited image labels cannot masquerade as
# server stack services.
##############################################################################

name: persistent-memory-client-build

services:
  persistent-memory-mcp:
    build:
      # Context = the persistent-memory/ workspace ROOT (NOT ./apps/mcp): the Dockerfile
      # is workspace-aware and needs the root package.json + package-lock.json +
      # packages/shared/ (the @pm/shared Mode-B embedder) alongside apps/mcp/.
      context: ../..
      dockerfile: apps/mcp/Dockerfile
    image: persistent-memory-mcp:latest
    # Linux needs this so the container can reach HOST Ollama at 11434 via
    # host.docker.internal. No-op (already present) on Docker Desktop mac/Win.
    # Kept here for parity; the authoritative launch path is the Docker wrapper in
    # ~/.claude.json/Codex config, which passes --add-host itself (see README/gotchas).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # API_URL: how the MCP reaches the SERVER stack's api service.
      #   - Same machine, host-published port:  http://host.docker.internal:8090
      #   - Same machine via shared network:    http://persistent-memory-api:8090
      #   - Remote server:                      http://<server-host>:8090
      API_URL: ${API_URL:-http://host.docker.internal:8090}
      # Local Ollama for Mode B (EMBEDDING_MODE=client-bridge): the MCP embeds
      # locally and ships vectors to the server. Always the laptop's host Ollama.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:4b}
      EMBED_DIM: ${EMBED_DIM:-2560}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-server}
      # Per-user identity. Passed through from the launching shell / ~/.claude.json
      # env block; NOT a literal default here (placeholder only — real token is secret).
      PM_USER_TOKEN: ${PM_USER_TOKEN:-}
    # stdin must stay open for the stdio JSON-RPC transport. Compose-run is
    # legacy build/smoke only; new Node stdio registration uses the local wrapper.
    stdin_open: true
    tty: false
    networks:
      - persistent_memory_network

networks:
  persistent_memory_network:
    driver: bridge
    name: persistent_memory_network
